<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc</title>
    <script src="https://cdn.tailwindcss.com" ></script>
</head>
<body>

    <div class="space-y-4">
  <h2>Login</h2>
  <p>Enter your account details.</p>
  <input type="email">
  <button>Login</button>

  
</div>

  <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg">
  Login
</button>
<br>
<input
  type="text"
  class=" mt-12  border-gray-300 focus:border-blue-600"
  placeholder="Enter your name"
>



<form class="w-96 space-y-4">

  <input
    type="email"
    placeholder="Email"
    class="w-full border border-gray-300 rounded-lg p-3
           focus:border-blue-600 focus:outline-none"
  >

  <input
    type="password"
    placeholder="Password"
    class="w-full border border-gray-300 rounded-lg p-3
           focus:border-blue-600 focus:outline-none"
  >

  <button
    class="w-full bg-blue-600 hover:bg-blue-700
           text-white font-semibold py-3 rounded-lg"
  >
    Login
  </button>

</form>

<input
  class="m-12 border border-gray-300 rounded-lg
         focus:ring-2 focus:ring-blue-500"
         placeholder="focus ring"
>
<input
  class="border border-gray-300 rounded-lg
         focus:border-blue-600
         focus:ring-2
         focus:ring-blue-200"
>

<button
  class="bg-blue-600 hover:bg-blue-700
         transition text-white px-5 py-3 rounded-lg"
>
  Login
</button>
</body>
</html>
