<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-card">

        <h1>Weather App</h1>
        <p>Check current weather</p>

        <div class="search-box">
            <input id="city" type="text" placeholder="Enter city">
            <button onclick="getWeather()">Search</button>
        </div>

        <div id="result">

            <h2 id="place">Search a city</h2>

            <div id="icon">🌤️</div>

            <h3 id="temp">--°C</h3>

            <p id="status">Weather condition</p>

            <div class="details">
                <div>
                    💧
                    <p>Humidity</p>
                    <b id="humidity">--%</b>
                </div>

                <div>
                    💨
                    <p>Wind</p>
                    <b id="wind">-- km/h</b>
                </div>
            </div>

        </div>

        <p id="error"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
